<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Transcritor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efebe1;
    --surface: #f7f4ec;
    --ink: #211f19;
    --ink-soft: #655e4e;
    --rule: #d9d2c0;
    --accent: #2b6d60;
    --accent-ink: #fff;
    --amber: #9c6b1f;
    --error: #8f3a2e;
    --row-hover: rgba(43, 109, 96, .07);
    --radius: 3px;
    --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
    --font-sans: "Archivo", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181a;
      --surface: #1b2023;
      --ink: #e9e6db;
      --ink-soft: #9b9890;
      --rule: #2a3033;
      --accent: #57b39f;
      --accent-ink: #0d1512;
      --amber: #d9a24b;
      --error: #d9776a;
      --row-hover: rgba(87, 179, 159, .12);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px 64px;
    font: 15px/1.6 var(--font-sans);
    color: var(--ink); background: var(--bg);
    transition: background .2s ease, color .2s ease;
  }
  main { max-width: 860px; margin: 0 auto; }

  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .wave { display: flex; align-items: flex-end; gap: 3px; height: 22px; flex-shrink: 0; }
  .wave span { width: 3px; border-radius: 1px; background: var(--accent); }
  .wave span:nth-child(1) { height: 35%; }
  .wave span:nth-child(2) { height: 90%; }
  .wave span:nth-child(3) { height: 55%; }
  .wave span:nth-child(4) { height: 100%; }
  .wave span:nth-child(5) { height: 60%; }
  h1 { margin: 0; font-family: var(--font-serif); font-weight: 600; font-size: 28px; letter-spacing: -.01em; }
  .tagline { margin: 6px 0 36px; color: var(--ink-soft); font-size: 14px; max-width: 46em; }

  .segmented { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; flex-shrink: 0; }
  .segmented button {
    border: none; border-right: 1px solid var(--rule); background: var(--surface); color: var(--ink-soft);
    font: 500 12px var(--font-sans); padding: 5px 9px; cursor: pointer;
  }
  .segmented button:last-child { border-right: none; }
  .segmented button.on { background: var(--accent); color: var(--accent-ink); }

  .topbar-controls { display: flex; align-items: center; gap: 10px; }
  .linklike {
    background: none; border: none; color: var(--ink-soft); font: 500 12px var(--font-sans);
    cursor: pointer; padding: 5px 2px; text-decoration: underline; text-underline-offset: 2px;
  }
  .linklike:hover { color: var(--accent); }
  .banner {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border: 1px solid var(--amber); border-radius: var(--radius); padding: 10px 14px;
    font-size: 13px; color: var(--amber); margin-bottom: 24px;
  }
  .banner button { flex-shrink: 0; }

  h2 { margin: 0 0 20px; font-family: var(--font-serif); font-weight: 600; font-size: 18px; }
  section + section { margin-top: 48px; }
  .slip { border-top: 3px solid var(--accent); padding-top: 22px; }

  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px 16px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-soft); }
  input[type=text], input[type=number], input[type=file], select {
    font: inherit; font-family: var(--font-sans); color: var(--ink);
    background: transparent; border: none; border-bottom: 1px solid var(--rule);
    padding: 7px 2px; border-radius: 0;
  }
  select { background-color: var(--bg); }
  input[type=file]::file-selector-button {
    font: 500 13px var(--font-sans); color: var(--accent); background: transparent;
    border: 1px solid var(--rule); border-radius: var(--radius); padding: 5px 10px; margin-right: 10px;
    cursor: pointer;
  }
  input[type=file]::file-selector-button:hover { border-color: var(--accent); }
  .full { grid-column: 1 / -1; }
  button, a { font-family: var(--font-sans); }
  button[type=submit] {
    font: 600 14px var(--font-sans); padding: 10px 20px; border: none; border-radius: var(--radius);
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  progress { width: 100%; height: 6px; border: none; border-radius: 3px; background: var(--rule); overflow: hidden; }
  progress::-webkit-progress-bar { background: var(--rule); }
  progress::-webkit-progress-value { background: var(--accent); }
  progress::-moz-progress-bar { background: var(--accent); }
  .msg { font-size: 13px; color: var(--ink-soft); min-height: 1.4em; }
  .msg.err { color: var(--error); }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font: 500 12px var(--font-sans); color: var(--ink-soft);
    padding: 0 8px 10px; border-bottom: 1px solid var(--rule);
  }
  tbody td { padding: 14px 8px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  tbody tr:hover td { background: var(--row-hover); }
  td.title a, td.title span { font-family: var(--font-serif); font-size: 15.5px; color: var(--ink); }
  td.title a { text-decoration: none; border-bottom: 1px solid transparent; }
  td.title a:hover { border-bottom-color: var(--accent); }
  td.actions { text-align: right; white-space: nowrap; }
  td.actions a.open { color: var(--accent); text-decoration: none; font-weight: 500; margin-right: 16px; }
  td.actions a.open:hover { text-decoration: underline; }
  button.secondary {
    background: none; border: none; color: var(--ink-soft); font: inherit; font-size: 13px;
    cursor: pointer; padding: 0;
  }
  button.secondary:hover { color: var(--error); text-decoration: underline; }

  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; white-space: nowrap; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .status.done { color: var(--accent); }
  .status.done .dot { background: var(--accent); }
  .status.error { color: var(--error); }
  .status.error .dot { background: var(--error); }
  .status.pending { color: var(--amber); }
  .status.pending .dot { background: var(--amber); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .status.pending .dot { animation: none; } }

  .empty { padding: 28px 0 8px; }
  .empty p { margin: 0; font-family: var(--font-serif); font-style: italic; color: var(--ink-soft); font-size: 16px; }
  .empty small { display: block; margin-top: 4px; color: var(--ink-soft); font-size: 13px; }
  .table-wrap { overflow-x: auto; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <div class="brand">
        <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
        <h1>Transcritor</h1>
      </div>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <div class="topbar-controls">
      <button type="button" class="linklike" id="settingsToggle" data-i18n="settingsToggle"></button>
      <div class="segmented" id="langsw">
        <button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button>
      </div>
    </div>
  </div>

  <div class="banner" id="keyBanner" hidden>
    <span data-i18n="apiKeyMissing"></span>
    <button type="button" class="linklike" id="keyBannerLink" data-i18n="apiKeySetUp"></button>
  </div>

  <section id="settingsSection" hidden>
    <div class="slip">
      <h2 data-i18n="apiKeyTitle"></h2>
      <p class="msg">
        <span data-i18n="apiKeyHint"></span> <a href="https://www.assemblyai.com" target="_blank" rel="noopener">assemblyai.com</a>
      </p>
      <form id="apiKeyForm">
        <label class="full" data-i18n="apiKeyLabel">
          <input type="password" id="apiKeyInput" autocomplete="off" data-i18n-placeholder="apiKeyPlaceholder">
        </label>
        <div class="full">
          <button type="submit" id="apiKeySubmit" data-i18n="apiKeySave"></button>
        </div>
        <div class="full msg" id="apiKeyMsg"></div>
      </form>
    </div>
  </section>

  <section>
    <div class="slip">
      <h2 data-i18n="newTranscription"></h2>
      <form id="form">
        <label class="full" data-i18n="fileLabel">
          <input type="file" id="file" accept="audio/*,video/*" required>
        </label>
        <label data-i18n="titleLabel">
          <input type="text" id="title" data-i18n-placeholder="titlePlaceholder">
        </label>
        <label data-i18n="speakersLabel">
          <input type="number" id="speakers" min="1" max="30" data-i18n-placeholder="speakersPlaceholder">
        </label>
        <label data-i18n="languageLabel">
          <select id="language">
            <option value="" data-i18n="languageAuto"></option>
            <option value="pt">Português</option>
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="it">Italiano</option>
            <option value="nl">Nederlands</option>
            <option value="ru">Русский</option>
            <option value="ja">日本語</option>
            <option value="zh">中文</option>
            <option value="ko">한국어</option>
            <option value="hi">हिन्दी</option>
            <option value="ar">العربية</option>
          </select>
        </label>
        <label class="full" data-i18n="keytermsLabel">
          <input type="text" id="keyterms" data-i18n-placeholder="keytermsPlaceholder">
        </label>
        <div class="full">
          <button type="submit" id="submit" data-i18n="submit"></button>
        </div>
        <div class="full" id="progressWrap" hidden>
          <progress id="progress" max="1" value="0"></progress>
        </div>
        <div class="full msg" id="formMsg"></div>
      </form>
    </div>
  </section>

  <section>
    <h2 data-i18n="transcriptionsHeading"></h2>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th data-i18n="colTitle"></th><th data-i18n="colDate"></th><th data-i18n="colDuration"></th><th data-i18n="colStatus"></th><th></th>
        </tr></thead>
        <tbody id="list"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>
      <p data-i18n="emptyTitle"></p>
      <small data-i18n="emptyHint"></small>
    </div>
  </section>
</main>

<script>

    emptyTitle: "Nenhuma transcrição ainda.",
    emptyHint: "Envie um áudio acima para começar.",
  },
  en: {
    tagline: "Transcribe audio and meetings with speaker identification, reviewing the text alongside the audio.",
    settingsToggle: "API key",
    apiKeyMissing: "Set up your AssemblyAI key to start transcribing.",
    apiKeySetUp: "Set up",

    msgSendError: "Failed to upload the file. Is Transcritor still open?",

    colTitle: "Title", colDate: "Date", colDuration: "Duration", colStatus: "Status",
    statusUploading: "Uploading to AssemblyAI…",
    statusProcessing: "Transcribing…",
    statusDone: "Done",
    statusError: "Error",
    actionOpen: "Open",
    actionDelete: "Delete",
    confirmDelete: title => `Delete "${title}"? The audio and transcript will be removed.`,
    emptyTitle: "No transcriptions yet.",
    emptyHint: "Upload an audio file above to get started.",
  },
  es: {
    tagline: "Transcribe audios y reuniones con identificación de quién habla, revisando el texto junto con el audio.",
    settingsToggle: "Clave de API",
    apiKeyMissing: "Configura tu clave de AssemblyAI para empezar a transcribir.",
    apiKeySetUp: "Configurar",
    apiKeyTitle: "Clave de API de AssemblyAI",
    apiKeyHint: "Crea una cuenta gratuita y obtén tu clave en",
    apiKeyLabel: "Clave",

    apiKeySave: "Guardar clave",
    apiKeySaving: "Verificando…",
    apiKeySuccess: "Clave guardada. Ya puedes transcribir.",
    newTranscription: "Nueva transcripción",
    fileLabel: "Archivo de audio o video",
    titleLabel: "Título (opcional)",
    titlePlaceholder: "Nombre del archivo",
    speakersLabel: "Número de hablantes (opcional)",
    speakersPlaceholder: "Detectar",
    languageLabel: "Idioma del audio (opcional)",
    languageAuto: "Detectar automáticamente",
    keytermsLabel: "Términos importantes, separados por coma (opcional)",
    keytermsPlaceholder: "Ej.: Carl Rogers, El Proceso de Convertirse en Persona",

    msgReceived: "Archivo recibido. La transcripción continúa aunque cierres esta página.",
    msgSendFailed: "Error al subir: ",
    msgSendError: "No se pudo subir el archivo. ¿Transcritor sigue abierto?",
    transcriptionsHeading: "Transcripciones",
    colTitle: "Título", colDate: "Fecha", colDuration: "Duración", colStatus: "Estado",
    statusUploading: "Enviando a AssemblyAI…",
    statusProcessing: "Transcribiendo…",

    actionOpen: "Abrir",
    actionDelete: "Eliminar",
    confirmDelete: title => `¿Eliminar "${title}"? El audio y la transcripción se borrarán.`,

    emptyHint: "Sube un audio arriba para comenzar.",
  },

function detectLang() {
  try {
    const saved = localStorage.getItem("transcritor-ui-lang");
    if (saved && I18N[saved]) return saved;
  } catch {}
  const nav = (navigator.language || "pt").slice(0, 2);
  return I18N[nav] ? nav : "pt";
}

let uiLang = detectLang();
const t = key => I18N[uiLang][key];

function applyI18n() {
  document.documentElement.lang = uiLang === "pt" ? "pt-BR" : uiLang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll("#langsw button").forEach(b => b.classList.toggle("on", b.dataset.lang === uiLang));
}

document.getElementById("langsw").addEventListener("click", e => {
  const btn = e.target.closest("button[data-lang]");
  if (!btn) return;
  uiLang = btn.dataset.lang;
  try { localStorage.setItem("transcritor-ui-lang", uiLang); } catch {}
  applyI18n();
  refresh();
});

let hasApiKey = false;

function applyApiKeyState() {
  document.getElementById("keyBanner").hidden = hasApiKey;
  document.getElementById("submit").disabled = !hasApiKey;
  if (!hasApiKey) document.getElementById("settingsSection").hidden = false;
}

async function checkSettings() {
  const data = await fetch("/api/settings").then(r => r.json());
  hasApiKey = !!data.has_api_key;
  applyApiKeyState();
}

function toggleSettings() {
  const sec = document.getElementById("settingsSection");
  sec.hidden = !sec.hidden;
  if (!sec.hidden) document.getElementById("apiKeyInput").focus();
}

document.getElementById("settingsToggle").addEventListener("click", toggleSettings);
document.getElementById("keyBannerLink").addEventListener("click", toggleSettings);

document.getElementById("apiKeyForm").addEventListener("submit", async e => {
  e.preventDefault();
  const input = document.getElementById("apiKeyInput");
  const btn = document.getElementById("apiKeySubmit");
  const msg = document.getElementById("apiKeyMsg");
  const key = input.value.trim();
  if (!key) return;

  btn.disabled = true;
  msg.className = "full msg";
  msg.textContent = t("apiKeySaving");
  try {
    const r = await fetch("/api/settings", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ assemblyai_api_key: key }),
    });
    const data = await r.json();
    if (r.ok) {
      msg.className = "full msg";
      msg.textContent = t("apiKeySuccess");
      input.value = "";
      await checkSettings();
    } else {
      msg.className = "full msg err";
      msg.textContent = data.error || String(r.status);
    }
  } catch {
    msg.className = "full msg err";
    msg.textContent = t("msgSendError");
  } finally {
    btn.disabled = false;
  }
});

const STATUS_KEY = {
  uploading: ["statusUploading", "pending"],
  processing: ["statusProcessing", "pending"],
  done: ["statusDone", "done"],
  error: ["statusError", "error"],
};

const fmtDur = s => {
  if (!s) return "—";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `${h}h${String(m).padStart(2, "0")}` : `${m}:${String(sec).padStart(2, "0")}`;
};
const fmtDate = iso => new Date(iso).toLocaleString(uiLang, { dateStyle: "short", timeStyle: "short" });

let pollTimer = null;

async function refresh() {
  const items = await fetch("/api/transcripts").then(r => r.json());
  const tbody = document.getElementById("list");
  tbody.replaceChildren();
  document.getElementById("empty").hidden = items.length > 0;

  for (const it of items) {
    const tr = document.createElement("tr");
    const [labelKey, cls] = STATUS_KEY[it.status] || [null, ""];
    const label = labelKey ? t(labelKey) : it.status;

    const title = document.createElement("td");
    title.className = "title";
    if (it.status === "done") {
      const a = document.createElement("a");
      a.href = `/view/${it.id}`;
      a.textContent = it.title;
      title.append(a);
    } else {
      const span = document.createElement("span");
      span.textContent = it.title;
      title.append(span);
    }

    const status = document.createElement("td");
    const badge = document.createElement("span");
    badge.className = `status ${cls}`;
    const dot = document.createElement("span");
    dot.className = "dot";
    badge.append(dot, document.createTextNode(label));
    if (it.status === "error") badge.title = it.error || "";
    status.append(badge);

    const actions = document.createElement("td");
    actions.className = "actions";
    if (it.status === "done") {
      const open = document.createElement("a");
      open.className = "open";
      open.href = `/view/${it.id}`;
      open.textContent = t("actionOpen");
      actions.append(open);
    }
    const del = document.createElement("button");
    del.className = "secondary";
    del.textContent = t("actionDelete");
    del.addEventListener("click", async () => {
      if (!confirm(t("confirmDelete")(it.title))) return;
      await fetch(`/api/transcripts/${it.id}`, { method: "DELETE" });
      refresh();
    });
    actions.append(del);

    const date = document.createElement("td");
    date.textContent = fmtDate(it.created);
    const dur = document.createElement("td");
    dur.textContent = fmtDur(it.duration);

    tr.append(title, date, dur, status, actions);
    tbody.append(tr);
  }

  clearTimeout(pollTimer);
  if (items.some(it => it.status === "uploading" || it.status === "processing")) {
    pollTimer = setTimeout(refresh, 3000);
  }
}

const LANG_FIELD = document.getElementById("language");
try {
  const savedLang = localStorage.getItem("transcritor-audio-lang");
  if (savedLang) LANG_FIELD.value = savedLang;
} catch {}

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const file = document.getElementById("file").files[0];
  if (!file) return;
  try { localStorage.setItem("transcritor-audio-lang", LANG_FIELD.value); } catch {}
  const params = new URLSearchParams({
    title: document.getElementById("title").value,
    speakers: document.getElementById("speakers").value,
    keyterms: document.getElementById("keyterms").value,
    language: LANG_FIELD.value,
  });
  const submit = document.getElementById("submit");
  const msg = document.getElementById("formMsg");
  const progress = document.getElementById("progress");
  const wrap = document.getElementById("progressWrap");

  submit.disabled = true;
  wrap.hidden = false;
  msg.className = "full msg";
  msg.textContent = t("msgUploading");

  const xhr = new XMLHttpRequest();
  xhr.open("POST", `/api/transcripts?${params}`);
  xhr.setRequestHeader("X-Filename", encodeURIComponent(file.name));
  xhr.upload.onprogress = ev => { if (ev.lengthComputable) progress.value = ev.loaded / ev.total; };
  xhr.onload = () => {
    submit.disabled = !hasApiKey;
    wrap.hidden = true;
    if (xhr.status === 201) {
      msg.textContent = t("msgReceived");
      e.target.reset();
      LANG_FIELD.value = "";
      try {
        const savedLang = localStorage.getItem("transcritor-audio-lang");
        if (savedLang) LANG_FIELD.value = savedLang;
      } catch {}
    } else {
      msg.className = "full msg err";
      msg.textContent = t("msgSendFailed") + (JSON.parse(xhr.responseText || "{}").error || xhr.status);
    }
    refresh();
  };
  xhr.onerror = () => {
    submit.disabled = !hasApiKey;
    wrap.hidden = true;
    msg.className = "full msg err";
    msg.textContent = t("msgSendError");
  };
  xhr.send(file);
});

applyI18n();
checkSettings();

// Keep the local server alive while this page is open
setInterval(() => fetch("/api/ping").catch(() => {}), 30000);
fetch("/api/ping");
refresh();
</script>
</body>
</html>
