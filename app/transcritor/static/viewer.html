<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Transcritor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efebe1;
    --surface: #f7f4ec;
    --ink: #211f19;
    --ink-soft: #655e4e;
    --rule: #d9d2c0;
    --accent: #2b6d60;
    --accent-ink: #fff;
    --amber: #9c6b1f;
    --error: #8f3a2e;
    --highlight: rgba(43, 109, 96, .14);
    --radius: 3px;
    --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
    --font-sans: "Archivo", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181a;
      --surface: #1b2023;
      --ink: #e9e6db;
      --ink-soft: #9b9890;
      --rule: #2a3033;
      --accent: #57b39f;
      --accent-ink: #0d1512;
      --amber: #d9a24b;
      --error: #d9776a;
      --highlight: rgba(87, 179, 159, .22);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; gap: 4px;
    padding: 16px 20px; font: 15px/1.7 var(--font-sans);
    color: var(--ink); background: var(--bg);
    transition: background .2s ease, color .2s ease;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding-bottom: 14px; border-bottom: 1px solid var(--rule);
  }
  a.back { color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 500; }
  a.back:hover { text-decoration: underline; }
  #title {
    margin: 0; font-family: var(--font-serif); font-weight: 600; font-size: 19px;
    flex: 1; min-width: 180px; cursor: pointer;
    border-bottom: 1px dotted transparent;
  }
  #title:hover { border-bottom-color: var(--ink-soft); }
  .exports { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); }
  .exports a {
    padding: 4px 10px; border: 1px solid var(--rule); border-radius: var(--radius);
    color: var(--ink); text-decoration: none; font-size: 13px;
  }
  .exports a:hover { border-color: var(--accent); color: var(--accent); }

  .segmented { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; flex-shrink: 0; }
  .segmented button {
    border: none; border-right: 1px solid var(--rule); background: var(--surface); color: var(--ink-soft);
    font: 500 12px var(--font-sans); padding: 5px 9px; cursor: pointer;
  }
  .segmented button:last-child { border-right: none; }
  .segmented button.on { background: var(--accent); color: var(--accent-ink); }

  #bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 14px 0 6px; }
  #play {
    width: 42px; height: 42px; border-radius: 50%; border: none; flex-shrink: 0;
    background: var(--accent); color: var(--accent-ink); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #play:hover { filter: brightness(1.08); }
  #seek {
    flex: 1; min-width: 200px; height: 4px; -webkit-appearance: none; appearance: none;
    background: transparent; cursor: pointer;
  }
  #seek::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--rule) 0);
  }
  #seek::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--bg);
  }
  #seek::-moz-range-track { height: 4px; border-radius: 2px; background: var(--rule); }
  #seek::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
  #seek::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--bg); }
  #time { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 14px; min-width: 120px; text-align: right; }
  #speeds { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
  #speeds button {
    border: none; border-right: 1px solid var(--rule); background: var(--surface); color: var(--ink-soft);
    font: 500 13px var(--font-sans); padding: 5px 10px; cursor: pointer;
  }
  #speeds button:last-child { border-right: none; }
  #speeds button.on { background: var(--accent); color: var(--accent-ink); }
  #status { color: var(--error); font-size: 13px; }

  .legend { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-soft); padding: 6px 0 16px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  kbd {
    font-family: var(--font-sans); font-size: 11px; border: 1px solid var(--rule); border-bottom-width: 2px;
    border-radius: 3px; padding: 2px 6px; background: var(--surface); color: var(--ink);
  }

  .box { flex: 1; min-height: 0; overflow-y: auto; border-top: 1px solid var(--rule); background: var(--surface); border-radius: var(--radius); padding: 22px 26px; }
  .turn { margin: 0 0 22px; max-width: 720px; padding-left: 14px; border-left: 3px solid var(--turn-color, var(--rule)); }
  .turn-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px; }
  .speaker-name { font-family: var(--font-serif); font-weight: 600; font-size: 14.5px; color: var(--ink); cursor: pointer; }
  .speaker-name:hover { text-decoration: underline; }
  .turn-time { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink-soft); }
  .cur-sentence { background: var(--highlight); border-radius: 2px; }
  .cur-word { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; font-weight: 600; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
</style>
</head>
<body>
<header>
  <a class="back" href="/" id="backLink"></a>
  <h1 id="title">…</h1>
  <span class="exports">
    <span id="exportsLabel"></span>
    <a id="exp-docx" href="#">Word</a><a id="exp-txt" href="#"></a><a id="exp-srt" href="#"></a>
  </span>
  <div class="segmented" id="langsw">
    <button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button>
  </div>
</header>
<div id="bar">
  <button id="play">▶</button>
  <input id="seek" type="range" min="0" max="0" step="0.01" value="0">
  <span id="time">0:00 / 0:00</span>
  <span id="speeds"></span>
  <span id="status"></span>
</div>
<div class="legend">
  <span><kbd id="keySpace">Espaço</kbd> <span id="shortcutPlayPause"></span></span>
  <span><kbd>←</kbd><kbd>→</kbd> <span id="shortcutSkip"></span></span>
  <span id="shortcutRename"></span>
</div>
<div class="box" id="box"></div>
<audio id="audio" preload="auto"></audio>

<script>
const ID = location.pathname.split("/").pop();
const SPEEDS = [0.75, 1, 1.25, 1.5, 2];
const SKIP = 3;
const COLORS = ["#3f6fb0", "#b0553f", "#6b8f4f", "#8d5fa8", "#b08a2e", "#4f8fa6", "#a64f77", "#5f6b8d"];

const I18N = {
  pt: {
    backLink: "← Transcrições",
    titleTooltip: "Clique para renomear",
    playTooltip: "Tocar/pausar (Espaço)",
    keySpace: "Espaço",
    renamePromptTitle: "Novo título:",
    exportsLabel: "Exportar",
    exportWord: "Word",
    exportText: "Texto",
    exportSrt: "Legenda",
    shortcutPlayPause: "tocar/pausar",
    shortcutSkip: "avançar 3s",
    shortcutRename: "Clique no nome de um falante para renomeá-lo",
    renamePromptSpeaker: name => `Novo nome para "${name}":`,
    errAudio: "Este navegador não conseguiu tocar o áudio.",
    errNotFound: "Transcrição não encontrada.",
    errNotReady: "A transcrição ainda não está pronta.",
    speakerFallback: n => `Falante ${n}`,
  },
  en: {
    backLink: "← Transcriptions",
    titleTooltip: "Click to rename",
    playTooltip: "Play/pause (Space)",
    keySpace: "Space",
    renamePromptTitle: "New title:",
    exportsLabel: "Export",
    exportWord: "Word",
    exportText: "Text",
    exportSrt: "Subtitles",
    shortcutPlayPause: "play/pause",
    shortcutSkip: "skip 3s",
    shortcutRename: "Click a speaker's name to rename them",
    renamePromptSpeaker: name => `New name for "${name}":`,
    errAudio: "This browser couldn't play the audio.",
    errNotFound: "Transcription not found.",
    errNotReady: "The transcription isn't ready yet.",
    speakerFallback: n => `Speaker ${n}`,
  },
  es: {
    backLink: "← Transcripciones",
    titleTooltip: "Haz clic para renombrar",
    playTooltip: "Reproducir/pausar (Espacio)",
    keySpace: "Espacio",
    renamePromptTitle: "Nuevo título:",
    exportsLabel: "Exportar",
    exportWord: "Word",
    exportText: "Texto",
    exportSrt: "Subtítulos",
    shortcutPlayPause: "reproducir/pausar",
    shortcutSkip: "avanzar 3s",
    shortcutRename: "Haz clic en el nombre de un hablante para renombrarlo",
    renamePromptSpeaker: name => `Nuevo nombre para "${name}":`,
    errAudio: "Este navegador no pudo reproducir el audio.",
    errNotFound: "Transcripción no encontrada.",
    errNotReady: "La transcripción aún no está lista.",
    speakerFallback: n => `Hablante ${n}`,
  },
};

function detectLang() {
  try {
    const saved = localStorage.getItem("transcritor-ui-lang");
    if (saved && I18N[saved]) return saved;
  } catch {}
  const nav = (navigator.language || "pt").slice(0, 2);
  return I18N[nav] ? nav : "pt";
}

let uiLang = detectLang();
const t = key => I18N[uiLang][key];

function applyChrome() {
  document.documentElement.lang = uiLang === "pt" ? "pt-BR" : uiLang;
  document.getElementById("backLink").textContent = t("backLink");
  titleEl.title = t("titleTooltip");
  playBtn.title = t("playTooltip");
  document.getElementById("keySpace").textContent = t("keySpace");
  document.getElementById("exportsLabel").textContent = t("exportsLabel");
  document.getElementById("exp-txt").textContent = t("exportText");
  document.getElementById("exp-srt").textContent = t("exportSrt");
  document.getElementById("shortcutPlayPause").textContent = t("shortcutPlayPause");
  document.getElementById("shortcutSkip").textContent = t("shortcutSkip");
  document.getElementById("shortcutRename").textContent = t("shortcutRename");
  document.querySelectorAll("#langsw button").forEach(b => b.classList.toggle("on", b.dataset.lang === uiLang));
}

document.getElementById("langsw").addEventListener("click", e => {
  const btn = e.target.closest("button[data-lang]");
  if (!btn) return;
  uiLang = btn.dataset.lang;
  try { localStorage.setItem("transcritor-ui-lang", uiLang); } catch {}
  applyChrome();
  renderTags();
});

const audio = document.getElementById("audio");
const seek = document.getElementById("seek");
const playBtn = document.getElementById("play");
const timeEl = document.getElementById("time");
const statusEl = document.getElementById("status");
const box = document.getElementById("box");
const titleEl = document.getElementById("title");

let meta = null;
const sentences = [], words = [], tags = [];
let curS = -1, curW = -1, dragging = false;

const fmt = s => {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
};
const speakerName = sp => meta.speaker_names?.[sp] || t("speakerFallback")(sp);

// Last index whose start <= t, or -1
function findIndex(items, t) {
  let lo = 0, hi = items.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (items[mid].start <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}

function renderTags() {
  for (const { nameEl, turn } of tags) nameEl.textContent = speakerName(turn.speaker);
}

async function save(changes) {
  const r = await fetch(`/api/transcripts/${ID}`, {
    method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(changes),
  });
  Object.assign(meta, await r.json());
}

function render(transcript) {
  const speakers = meta.speakers || [];
  for (const turn of transcript.turns) {
    const p = document.createElement("p");
    p.className = "turn";
    p.style.setProperty("--turn-color", COLORS[speakers.indexOf(turn.speaker) % COLORS.length]);

    const head = document.createElement("div");
    head.className = "turn-head";
    const nameEl = document.createElement("span");
    nameEl.className = "speaker-name";
    nameEl.addEventListener("click", async () => {
      const name = prompt(t("renamePromptSpeaker")(speakerName(turn.speaker)), meta.speaker_names?.[turn.speaker] || "");
      if (name === null) return;
      await save({ speaker_names: { ...meta.speaker_names, [turn.speaker]: name } });
      renderTags();
    });
    const timeEl2 = document.createElement("span");
    timeEl2.className = "turn-time";
    timeEl2.textContent = fmt(turn.start);
    head.append(nameEl, timeEl2);
    tags.push({ nameEl, turn });
    p.append(head);

    for (const s of turn.sentences) {
      const sEl = document.createElement("span");
      for (const w of s.words) {
        const wEl = document.createElement("span");
        wEl.textContent = w.text;
        sEl.append(wEl, " ");
        words.push({ start: w.start, el: wEl });
      }
      p.append(sEl);
      sentences.push({ start: s.start, el: sEl });
    }
    box.append(p);
  }
  renderTags();
}

function setCurrent(list, oldIdx, newIdx, cls) {
  if (oldIdx === newIdx) return false;
  if (oldIdx >= 0) list[oldIdx].el.classList.remove(cls);
  if (newIdx >= 0) list[newIdx].el.classList.add(cls);
  return true;
}

function setSeekFill() {
  const pct = seek.max > 0 ? (seek.value / seek.max) * 100 : 0;
  seek.style.setProperty("--p", pct + "%");
}

function update() {
  const t = audio.currentTime;
  const s = findIndex(sentences, t);
  if (setCurrent(sentences, curS, s, "cur-sentence") && s >= 0) {
    // Scroll inside the box so the sentence sits about a third of the way down
    const el = sentences[s].el;
    const top = el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop;
    box.scrollTo({ top: top - box.clientHeight / 3, behavior: "smooth" });
  }
  curS = s;
  const w = findIndex(words, t);
  setCurrent(words, curW, w, "cur-word");
  curW = w;
  if (!dragging) seek.value = t;
  setSeekFill();
  timeEl.textContent = `${fmt(t)} / ${fmt(audio.duration || 0)}`;
}

function loop() {
  update();
  if (!audio.paused) requestAnimationFrame(loop);
}

function togglePlay() { audio.paused ? audio.play() : audio.pause(); }
function skip(d) { audio.currentTime = Math.min(Math.max(audio.currentTime + d, 0), audio.duration || 0); }

audio.addEventListener("play", () => { playBtn.textContent = "❚❚"; requestAnimationFrame(loop); });
audio.addEventListener("pause", () => { playBtn.textContent = "▶"; update(); });
audio.addEventListener("seeked", update);
audio.addEventListener("timeupdate", () => { if (audio.paused) update(); });
audio.addEventListener("loadedmetadata", () => { seek.max = audio.duration; update(); });
audio.addEventListener("error", () => { statusEl.textContent = t("errAudio"); });

playBtn.addEventListener("click", () => { togglePlay(); playBtn.blur(); });
seek.addEventListener("input", () => { dragging = true; audio.currentTime = +seek.value; setSeekFill(); });
seek.addEventListener("change", () => { dragging = false; seek.blur(); });

const speedsEl = document.getElementById("speeds");
for (const r of SPEEDS) {
  const b = document.createElement("button");
  b.textContent = `${r}x`;
  b.className = r === 1 ? "on" : "";
  b.addEventListener("click", () => {
    audio.playbackRate = r;
    speedsEl.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    b.blur();
  });
  speedsEl.append(b);
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON" || e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "ArrowLeft") { e.preventDefault(); skip(-SKIP); }
  else if (e.code === "ArrowRight") { e.preventDefault(); skip(SKIP); }
});

titleEl.addEventListener("click", async () => {
  const title = prompt(t("renamePromptTitle"), meta.title);
  if (!title || !title.trim()) return;
  await save({ title });
  titleEl.textContent = document.title = meta.title;
});

async function load() {
  const r = await fetch(`/api/transcripts/${ID}`);
  if (!r.ok) { statusEl.textContent = t("errNotFound"); return; }
  const data = await r.json();
  meta = data;
  titleEl.textContent = document.title = meta.title;
  for (const fmtName of ["docx", "txt", "srt"]) {
    document.getElementById(`exp-${fmtName}`).href = `/api/transcripts/${ID}/export.${fmtName}`;
  }
  if (!data.transcript) { statusEl.textContent = t("errNotReady"); return; }
  render(data.transcript);
  audio.src = `/api/transcripts/${ID}/audio`;
}

applyChrome();
setInterval(() => fetch("/api/ping").catch(() => {}), 30000);
fetch("/api/ping");
load();
</script>
</body>
</html>
