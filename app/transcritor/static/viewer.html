<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Transcritor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efebe1;
    --surface: #f7f4ec;
    --ink: #211f19;
    --ink-soft: #655e4e;
    --rule: #d9d2c0;
    --accent: #2b6d60;
    --accent-ink: #fff;
    --amber: #9c6b1f;
    --error: #8f3a2e;
    --highlight: rgba(43, 109, 96, .14);
    --radius: 3px;
    --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
    --font-sans: "Archivo", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181a;
      --surface: #1b2023;
      --ink: #e9e6db;
      --ink-soft: #9b9890;
      --rule: #5c666b;
      --accent: #57b39f;
      --accent-ink: #0d1512;
      --amber: #d9a24b;
      --error: #d9776a;
      --highlight: rgba(87, 179, 159, .22);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; gap: 4px;
    padding: 16px 20px; font: 15px/1.7 var(--font-sans);
    color: var(--ink); background: var(--bg);
    transition: background .2s ease, color .2s ease;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding-bottom: 14px; border-bottom: 1px solid var(--rule);
  }
  a.back { color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 500; }
  a.back:hover { text-decoration: underline; }
  #title {
    margin: 0; font-family: var(--font-serif); font-weight: 600; font-size: 19px;
    flex: 1; min-width: 180px; cursor: pointer;
    border-bottom: 1px dotted transparent;
  }
  #title:hover { border-bottom-color: var(--ink-soft); }
  .exports { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); }
  .exports a {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border: 1px solid var(--rule); border-radius: var(--radius);
    color: var(--ink); text-decoration: none; font-size: 13px;
  }
  .exports a:hover { border-color: var(--accent); color: var(--accent); }
  .exports a svg { width: 13px; height: 13px; }

  .segmented { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; flex-shrink: 0; }
  .segmented button {
    border: none; border-right: 1px solid var(--rule); background: var(--surface); color: var(--ink-soft);
    font: 500 12px var(--font-sans); padding: 5px 9px; cursor: pointer;
  }
  .segmented button:last-child { border-right: none; }
  .segmented button.on { background: var(--accent); color: var(--accent-ink); }
  .globe-icon { width: 16px; height: 16px; color: var(--ink-soft); flex-shrink: 0; }

  #bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 14px 0 6px; }
  #play {
    width: 42px; height: 42px; border-radius: 50%; border: none; flex-shrink: 0;
    background: var(--accent); color: var(--accent-ink); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #play:hover { filter: brightness(1.08); }
  #play svg { width: 17px; height: 17px; }
  #seek {
    flex: 1; min-width: 200px; height: 4px; -webkit-appearance: none; appearance: none;
    background: transparent; cursor: pointer;
  }
  #seek::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--rule) 0);
  }
  #seek::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--bg);
  }
  #seek::-moz-range-track { height: 4px; border-radius: 2px; background: var(--rule); }
  #seek::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
  #seek::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--bg); }
  #time { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 14px; min-width: 120px; text-align: right; }
  #speeds { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
  #speeds button {
    border: none; border-right: 1px solid var(--rule); background: var(--surface); color: var(--ink-soft);
    font: 500 13px var(--font-sans); padding: 5px 10px; cursor: pointer;
  }
  #speeds button:last-child { border-right: none; }
  #speeds button.on { background: var(--accent); color: var(--accent-ink); }
  #status { color: var(--error); font-size: 13px; }

  .legend { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-soft); padding: 6px 0 16px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  kbd {
    font-family: var(--font-sans); font-size: 11px; border: 1px solid var(--rule); border-bottom-width: 2px;
    border-radius: 3px; padding: 2px 6px; background: var(--surface); color: var(--ink);
  }

  .box { flex: 1; min-height: 0; overflow-y: auto; border-top: 1px solid var(--rule); background: var(--surface); border-radius: var(--radius); padding: 22px 26px; }
  .turn { margin: 0 0 22px; max-width: 720px; padding-left: 14px; border-left: 3px solid var(--turn-color, var(--rule)); }
  .turn-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px; }
  .speaker-name { font-family: var(--font-serif); font-weight: 600; font-size: 14.5px; color: var(--ink); cursor: pointer; }
  .speaker-name:hover { text-decoration: underline; }
  .turn-time { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink-soft); }
  .cur-sentence { background: var(--highlight); border-radius: 2px; }
  .cur-word { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; font-weight: 600; }

  .turn-text { white-space: pre-wrap; border-radius: 2px; padding: 2px 4px; margin: 0 0 0 -4px; outline: none; }
  .turn-text:focus { background: var(--highlight); }

  dialog {
    background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: var(--radius);
    padding: 22px 24px; max-width: 360px; width: 90vw; font: 15px/1.5 var(--font-sans);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog h2 { margin: 0 0 18px; font-family: var(--font-serif); font-weight: 600; font-size: 18px; }
  dialog form { display: grid; gap: 16px; }
  dialog label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-soft); }
  dialog input[type=text], dialog select {
    font: inherit; font-family: var(--font-sans); color: var(--ink);
    background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius);
    padding: 7px 9px;
  }
  .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  .dialog-actions button { font: 600 13px var(--font-sans); padding: 8px 16px; border-radius: var(--radius); cursor: pointer; }
  .dialog-actions .cancel { background: none; border: 1px solid var(--rule); color: var(--ink); }
  .dialog-actions .primary { background: var(--accent); border: none; color: var(--accent-ink); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
</style>
</head>
<body>
<header>
  <a class="back" href="/" id="backLink"></a>
  <h1 id="title">…</h1>
  <div class="segmented" id="modesw" hidden>
    <button type="button" data-mode="listen" class="on"></button><button type="button" data-mode="edit"></button>
  </div>
  <span class="exports">
    <span id="exportsLabel"></span>
    <a id="exp-docx" href="#"><i data-lucide="file-text" aria-hidden="true"></i> Word</a><a id="exp-txt" href="#"><i data-lucide="file" aria-hidden="true"></i> <span id="exp-txt-label"></span></a><a id="exp-srt" href="#"><i data-lucide="captions" aria-hidden="true"></i> <span id="exp-srt-label"></span></a>
  </span>
  <i data-lucide="globe" class="globe-icon" aria-hidden="true"></i>
  <div class="segmented" id="langsw">
    <button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button>
  </div>
</header>
<div id="bar">
  <button id="play">
    <i data-lucide="play" id="playIcon" aria-hidden="true"></i>
    <i data-lucide="pause" id="pauseIcon" aria-hidden="true" hidden></i>
  </button>
  <input id="seek" type="range" min="0" max="0" step="0.01" value="0">
  <span id="time">0:00 / 0:00</span>
  <span id="speeds"></span>
  <span id="status"></span>
</div>
<div class="legend">
  <span><kbd id="keySpace">Espaço</kbd> <span id="shortcutPlayPause"></span></span>
  <span><kbd>←</kbd><kbd>→</kbd> <span id="shortcutSkip"></span></span>
  <span id="shortcutRename"></span>
</div>
<div class="box" id="box"></div>
<div class="box" id="editBox" hidden></div>
<audio id="audio" preload="auto"></audio>

<dialog id="speakerDialog">
  <h2 id="speakerDialogTitle"></h2>
  <form id="speakerForm">
    <label id="speakerReassignRow" hidden>
      <span id="speakerReassignLabelTxt"></span>
      <select id="speakerReassignSelect"></select>
    </label>
    <label>
      <span id="speakerNameLabelTxt"></span>
      <input type="text" id="speakerNameInput">
    </label>
    <div class="dialog-actions">
      <button type="button" class="cancel" id="speakerCancelBtn"></button>
      <button type="button" class="primary" id="speakerSaveBtn"></button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/lucide@1.52.0/dist/umd/lucide.js"></script>
<script>
const ID = location.pathname.split("/").pop();
const SPEEDS = [0.75, 1, 1.25, 1.5, 2];
const SKIP = 3;
const COLORS = ["#3f6fb0", "#b0553f", "#6b8f4f", "#8d5fa8", "#b08a2e", "#4f8fa6", "#a64f77", "#5f6b8d"];

const I18N = {
  pt: {
    backLink: "← Transcrições",
    titleTooltip: "Clique para renomear",
    playTooltip: "Tocar/pausar (Espaço)",
    keySpace: "Espaço",
    renamePromptTitle: "Novo título:",
    modeListen: "Ouvir",
    modeEdit: "Editar",
    exportsLabel: "Exportar",
    exportWord: "Word",
    exportText: "Texto",
    exportSrt: "Legenda",
    shortcutPlayPause: "tocar/pausar",
    shortcutSkip: "avançar 3s",
    shortcutRename: "Clique no nome de um falante para editá-lo",
    errAudio: "Este navegador não conseguiu tocar o áudio.",
    errNotFound: "Transcrição não encontrada.",
    errNotReady: "A transcrição ainda não está pronta.",
    speakerFallback: n => `Falante ${n}`,
    cancel: "Cancelar",
    save: "Salvar",
    speakerDialogTitle: "Editar falante",
    speakerReassignLabel: "Falante",
    speakerNameLabel: "Nome",
    speakerNewOption: "+ Novo falante",
    speakerNamePlaceholder: "Nome (opcional)",
  },
  en: {
    backLink: "← Transcriptions",
    titleTooltip: "Click to rename",
    playTooltip: "Play/pause (Space)",
    keySpace: "Space",
    renamePromptTitle: "New title:",
    modeListen: "Listen",
    modeEdit: "Edit",
    exportsLabel: "Export",
    exportWord: "Word",
    exportText: "Text",
    exportSrt: "Subtitles",
    shortcutPlayPause: "play/pause",
    shortcutSkip: "skip 3s",
    shortcutRename: "Click a speaker's name to edit them",
    errAudio: "This browser couldn't play the audio.",
    errNotFound: "Transcription not found.",
    errNotReady: "The transcription isn't ready yet.",
    speakerFallback: n => `Speaker ${n}`,
    cancel: "Cancel",
    save: "Save",
    speakerDialogTitle: "Edit speaker",
    speakerReassignLabel: "Speaker",
    speakerNameLabel: "Name",
    speakerNewOption: "+ New speaker",
    speakerNamePlaceholder: "Name (optional)",
  },
  es: {
    backLink: "← Transcripciones",
    titleTooltip: "Haz clic para renombrar",
    playTooltip: "Reproducir/pausar (Espacio)",
    keySpace: "Espacio",
    renamePromptTitle: "Nuevo título:",
    modeListen: "Escuchar",
    modeEdit: "Editar",
    exportsLabel: "Exportar",
    exportWord: "Word",
    exportText: "Texto",
    exportSrt: "Subtítulos",
    shortcutPlayPause: "reproducir/pausar",
    shortcutSkip: "avanzar 3s",
    shortcutRename: "Haz clic en el nombre de un hablante para editarlo",
    errAudio: "Este navegador no pudo reproducir el audio.",
    errNotFound: "Transcripción no encontrada.",
    errNotReady: "La transcripción aún no está lista.",
    speakerFallback: n => `Hablante ${n}`,
    cancel: "Cancelar",
    save: "Guardar",
    speakerDialogTitle: "Editar hablante",
    speakerReassignLabel: "Hablante",
    speakerNameLabel: "Nombre",
    speakerNewOption: "+ Nuevo hablante",
    speakerNamePlaceholder: "Nombre (opcional)",
  },
};

function detectLang() {
  try {
    const saved = localStorage.getItem("transcritor-ui-lang");
    if (saved && I18N[saved]) return saved;
  } catch {}
  const nav = (navigator.language || "pt").slice(0, 2);
  return I18N[nav] ? nav : "pt";
}

let uiLang = detectLang();
const t = key => I18N[uiLang][key];

function applyChrome() {
  document.documentElement.lang = uiLang === "pt" ? "pt-BR" : uiLang;
  document.getElementById("backLink").textContent = t("backLink");
  titleEl.title = t("titleTooltip");
  playBtn.title = t("playTooltip");
  document.getElementById("keySpace").textContent = t("keySpace");
  modeSw.querySelector('[data-mode="listen"]').textContent = t("modeListen");
  modeSw.querySelector('[data-mode="edit"]').textContent = t("modeEdit");
  document.getElementById("exportsLabel").textContent = t("exportsLabel");
  document.getElementById("exp-txt-label").textContent = t("exportText");
  document.getElementById("exp-srt-label").textContent = t("exportSrt");
  document.getElementById("shortcutPlayPause").textContent = t("shortcutPlayPause");
  document.getElementById("shortcutSkip").textContent = t("shortcutSkip");
  document.getElementById("shortcutRename").textContent = t("shortcutRename");
  document.getElementById("speakerDialogTitle").textContent = t("speakerDialogTitle");
  document.getElementById("speakerReassignLabelTxt").textContent = t("speakerReassignLabel");
  document.getElementById("speakerNameLabelTxt").textContent = t("speakerNameLabel");
  document.getElementById("speakerNameInput").placeholder = t("speakerNamePlaceholder");
  document.getElementById("speakerCancelBtn").textContent = t("cancel");
  document.getElementById("speakerSaveBtn").textContent = t("save");
  document.querySelectorAll("#langsw button").forEach(b => b.classList.toggle("on", b.dataset.lang === uiLang));
}

document.getElementById("langsw").addEventListener("click", e => {
  const btn = e.target.closest("button[data-lang]");
  if (!btn) return;
  uiLang = btn.dataset.lang;
  try { localStorage.setItem("transcritor-ui-lang", uiLang); } catch {}
  applyChrome();
  renderTags();
});

const audio = document.getElementById("audio");
const seek = document.getElementById("seek");
const playBtn = document.getElementById("play");
const timeEl = document.getElementById("time");
const statusEl = document.getElementById("status");
const box = document.getElementById("box");
const editBox = document.getElementById("editBox");
const modeSw = document.getElementById("modesw");
const titleEl = document.getElementById("title");

let meta = null;
const sentences = [], words = [], tags = [], editTags = [];
let curS = -1, curW = -1, dragging = false;
let viewMode = "listen", saveTimer = null;
const SENTENCE_END = [".", "?", "!", "…"];

const fmt = s => {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
};
const speakerName = sp => meta.speaker_names?.[sp] || t("speakerFallback")(sp);

// Last index whose start <= t, or -1
function findIndex(items, t) {
  let lo = 0, hi = items.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (items[mid].start <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}

function renderTags() {
  for (const { nameEl, turn } of tags) nameEl.textContent = speakerName(turn.speaker);
  for (const { nameEl, speaker } of editTags) nameEl.textContent = speakerName(speaker);
}

async function save(changes) {
  const r = await fetch(`/api/transcripts/${ID}`, {
    method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(changes),
  });
  Object.assign(meta, await r.json());
}

const speakerDialog = document.getElementById("speakerDialog");
const speakerReassignRow = document.getElementById("speakerReassignRow");
const speakerReassignSelect = document.getElementById("speakerReassignSelect");
const speakerNameInput = document.getElementById("speakerNameInput");
const NEW_SPEAKER = "__new__";
let speakerModalTarget = null;

function nextSpeakerLabel() {
  const used = new Set(meta.speakers || []);
  for (const c of "ABCDEFGHIJKLMNOPQRSTUVWXYZ") if (!used.has(c)) return c;
  let i = 1;
  while (used.has(`Speaker${i}`)) i++;
  return `Speaker${i}`;
}

// target is { wrap, nameEl } to allow reassigning that paragraph to a
// different (or brand new) speaker, or null for a plain rename (used in the
// read-only Original view, which must never change who said what).
function openSpeakerModal(speaker, target) {
  speakerModalTarget = target;
  speakerDialog.dataset.originalSpeaker = speaker;
  speakerReassignRow.hidden = !target;
  if (target) {
    speakerReassignSelect.innerHTML = "";
    for (const sp of meta.speakers || []) {
      const opt = document.createElement("option");
      opt.value = sp;
      opt.textContent = speakerName(sp);
      opt.selected = sp === speaker;
      speakerReassignSelect.append(opt);
    }
    const newOpt = document.createElement("option");
    newOpt.value = NEW_SPEAKER;
    newOpt.textContent = t("speakerNewOption");
    speakerReassignSelect.append(newOpt);
  }
  speakerNameInput.value = meta.speaker_names?.[speaker] || "";
  speakerDialog.showModal();
  speakerNameInput.focus();
}

speakerReassignSelect.addEventListener("change", () => {
  const val = speakerReassignSelect.value;
  speakerNameInput.value = val === NEW_SPEAKER ? "" : (meta.speaker_names?.[val] || "");
});

document.getElementById("speakerCancelBtn").addEventListener("click", () => speakerDialog.close());

document.getElementById("speakerSaveBtn").addEventListener("click", async () => {
  const original = speakerDialog.dataset.originalSpeaker;
  const target = speakerModalTarget;
  let chosen = original, isNew = false;
  if (target) {
    const val = speakerReassignSelect.value;
    if (val === NEW_SPEAKER) { chosen = nextSpeakerLabel(); isNew = true; }
    else chosen = val;
  }

  const name = speakerNameInput.value.trim();
  const changes = {};
  if (isNew) changes.speakers = [...(meta.speakers || []), chosen];
  if (name) changes.speaker_names = { ...meta.speaker_names, [chosen]: name };
  if (Object.keys(changes).length) await save(changes);

  if (target && chosen !== original) {
    target.wrap.dataset.speaker = chosen;
    target.wrap.style.setProperty("--turn-color", COLORS[(meta.speakers || []).indexOf(chosen) % COLORS.length]);
    const tagEntry = editTags.find(x => x.nameEl === target.nameEl);
    if (tagEntry) tagEntry.speaker = chosen;
    scheduleSave();
  }
  renderTags();
  speakerDialog.close();
});

// The turns both views work from. The original stays on disk untouched as the
// pristine copy, but once there are edits they're what the user is working
// with, so that's what gets shown and played.
function currentTurns() {
  return meta.transcript.edited_turns || meta.transcript.turns;
}

// Re-runnable: the listen view is rebuilt whenever we come back from editing,
// so it has to drop the previous nodes and the index built over them.
function renderListen(turns) {
  box.innerHTML = "";
  words.length = sentences.length = tags.length = 0;
  curS = curW = -1;
  const speakers = meta.speakers || [];
  for (const turn of turns) {
    const p = document.createElement("p");
    p.className = "turn";
    p.style.setProperty("--turn-color", COLORS[speakers.indexOf(turn.speaker) % COLORS.length]);

    const head = document.createElement("div");
    head.className = "turn-head";
    const nameEl = document.createElement("span");
    nameEl.className = "speaker-name";
    nameEl.addEventListener("click", () => openSpeakerModal(turn.speaker, null));
    const timeEl2 = document.createElement("span");
    timeEl2.className = "turn-time";
    timeEl2.textContent = fmt(turn.start);
    head.append(nameEl, timeEl2);
    tags.push({ nameEl, turn });
    p.append(head);

    for (const s of turn.sentences) {
      const sEl = document.createElement("span");
      for (const w of s.words) {
        const wEl = document.createElement("span");
        wEl.textContent = w.text;
        sEl.append(wEl, " ");
        words.push({ start: w.start, el: wEl });
      }
      p.append(sEl);
      sentences.push({ start: s.start, el: sEl });
    }
    box.append(p);
  }
  renderTags();
}

// --- Editing -----------------------------------------------------------
// The edit view flattens each turn into one plain-text paragraph. Typed
// words have no real AssemblyAI timing, so on save we interpolate each
// word's start/end proportionally by character count across the turn's
// time bounds (its own start, and the next turn's start as its end).

function endsSentence(word) {
  return SENTENCE_END.some(c => word.text.endsWith(c));
}

function turnsToParagraphs(turns, fallbackEnd) {
  return turns.map((turn, i) => {
    const allWords = turn.sentences.flatMap(s => s.words);
    const lastWord = allWords[allWords.length - 1];
    const end = i + 1 < turns.length ? turns[i + 1].start : (lastWord ? lastWord.end : fallbackEnd);
    return { speaker: turn.speaker, start: turn.start, end, text: allWords.map(w => w.text).join(" ") };
  });
}

function caretOffset(el) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return el.textContent.length;
  const range = sel.getRangeAt(0).cloneRange();
  range.selectNodeContents(el);
  range.setEnd(sel.anchorNode, sel.anchorOffset);
  return range.toString().length;
}

function setCaret(el, offset) {
  const sel = window.getSelection();
  const range = document.createRange();
  const node = el.firstChild;
  range.setStart(node || el, node ? Math.min(offset, node.length) : 0);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
}

function makeParagraph(speaker, start, end, text) {
  const speakers = meta.speakers || [];
  const wrap = document.createElement("div");
  wrap.className = "turn";
  wrap.style.setProperty("--turn-color", COLORS[speakers.indexOf(speaker) % COLORS.length]);
  wrap.dataset.speaker = speaker;
  wrap.dataset.start = start;
  wrap.dataset.end = end;

  const head = document.createElement("div");
  head.className = "turn-head";
  const nameEl = document.createElement("span");
  nameEl.className = "speaker-name";
  nameEl.addEventListener("click", () => openSpeakerModal(wrap.dataset.speaker, { wrap, nameEl }));
  head.append(nameEl);
  editTags.push({ nameEl, speaker });

  const textEl = document.createElement("div");
  textEl.className = "turn-text";
  textEl.contentEditable = "true";
  textEl.textContent = text;
  textEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); splitParagraph(wrap, textEl); }
    // Backspace with the caret at the very start has nothing to delete inside
    // this paragraph, so it undoes a split instead - the mirror of Enter.
    else if (e.key === "Backspace" && wrap.previousElementSibling && caretAtStart(textEl)) {
      e.preventDefault();
      mergeWithPrevious(wrap, textEl);
    }
  });
  textEl.addEventListener("input", scheduleSave);

  wrap.append(head, textEl);
  return wrap;
}

function renderEdit(turns) {
  editBox.innerHTML = "";
  editTags.length = 0;
  for (const { speaker, start, end, text } of turnsToParagraphs(turns, meta.duration || 0)) {
    editBox.append(makeParagraph(speaker, start, end, text));
  }
  renderTags();
}

function splitParagraph(wrap, textEl) {
  const offset = caretOffset(textEl);
  const text = textEl.textContent;
  const before = text.slice(0, offset).replace(/[ \t]+$/, "");
  const after = text.slice(offset).replace(/^[ \t]+/, "");
  const start = +wrap.dataset.start, end = +wrap.dataset.end;
  const split = start + (end - start) * (before.length / Math.max(1, before.length + after.length));

  textEl.textContent = before;
  wrap.dataset.end = split;

  const newWrap = makeParagraph(wrap.dataset.speaker, split, end, after);
  wrap.after(newWrap);
  newWrap.querySelector(".turn-text").focus();
  setCaret(newWrap.querySelector(".turn-text"), 0);
  scheduleSave();
}

function caretAtStart(el) {
  const sel = window.getSelection();
  return sel.isCollapsed && caretOffset(el) === 0;
}

// Fold this paragraph into the one above: the text joins on, the time bounds
// widen to cover both, and the merged paragraph keeps the earlier speaker -
// which is what makes this the tool for fixing a turn the diarizer split in
// two, as well as for undoing an accidental Enter.
function mergeWithPrevious(wrap, textEl) {
  const prev = wrap.previousElementSibling;
  const prevText = prev.querySelector(".turn-text");
  const before = prevText.textContent.replace(/\s+$/, "");
  const after = textEl.textContent.replace(/^\s+/, "");
  const gap = before && after ? " " : "";

  prevText.textContent = before + gap + after;
  prev.dataset.end = wrap.dataset.end;

  const i = editTags.findIndex(x => x.nameEl === wrap.querySelector(".speaker-name"));
  if (i >= 0) editTags.splice(i, 1);
  wrap.remove();

  prevText.focus();
  setCaret(prevText, before.length + gap.length);
  scheduleSave();
}

function groupSentences(allWords) {
  const sentences = [];
  for (const w of allWords) {
    const last = sentences.length ? sentences[sentences.length - 1] : null;
    if (!last || endsSentence(last.words[last.words.length - 1])) sentences.push({ start: w.start, end: w.end, words: [] });
    const s = sentences[sentences.length - 1];
    s.words.push(w);
    s.end = w.end;
  }
  return sentences;
}

function interpolateTurn(speaker, start, end, text) {
  const tokens = text.trim().split(/\s+/).filter(Boolean);
  if (!tokens.length) return null;
  const totalChars = tokens.reduce((n, w) => n + w.length, 0) + (tokens.length - 1);
  const span = end - start;
  let acc = 0;
  const allWords = tokens.map(w => {
    const wStart = start + span * (acc / totalChars);
    acc += w.length;
    const wEnd = start + span * (acc / totalChars);
    acc += 1;
    return { start: wStart, end: wEnd, text: w };
  });
  return { speaker, start, sentences: groupSentences(allWords) };
}

function buildSaveTurns() {
  return [...editBox.children].map(wrap =>
    interpolateTurn(wrap.dataset.speaker, +wrap.dataset.start, +wrap.dataset.end, wrap.querySelector(".turn-text").textContent)
  ).filter(Boolean);
}

// Takes the turns so a caller leaving the editor can hand over what it read
// out of the DOM, rather than this re-deriving it after the editor is gone.
async function doSaveEdits(turns) {
  clearTimeout(saveTimer);
  saveTimer = null;
  turns = turns || buildSaveTurns();
  meta.transcript.edited_turns = turns;
  await fetch(`/api/transcripts/${ID}/edited`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ turns }),
  });
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => doSaveEdits(), 800);
}

function updateExportLinks() {
  // Both views show the edited text, so exports always follow it. The server
  // falls back to the original when there are no edits yet.
  for (const fmtName of ["docx", "txt", "srt"]) {
    document.getElementById(`exp-${fmtName}`).href = `/api/transcripts/${ID}/export.${fmtName}?v=edited`;
  }
}

function setMode(mode) {
  if (mode === viewMode) return;
  if (viewMode === "edit") {
    // Read the editor before tearing it down, so the listen view rebuilds
    // from the current text instead of waiting on the save round-trip.
    doSaveEdits(buildSaveTurns());
  }
  viewMode = mode;
  modeSw.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  box.hidden = mode !== "listen";
  editBox.hidden = mode !== "edit";
  if (mode === "edit") renderEdit(currentTurns());
  else { renderListen(currentTurns()); update(); }
}

modeSw.addEventListener("click", e => {
  const btn = e.target.closest("button[data-mode]");
  if (btn) setMode(btn.dataset.mode);
});

// If an export is clicked while an edit hasn't been autosaved yet, flush it
// first so the download reflects the latest text, not the last saved one.
document.querySelector(".exports").addEventListener("click", async e => {
  const a = e.target.closest("a[id^='exp-']");
  if (!a || viewMode !== "edit" || !saveTimer) return;
  e.preventDefault();
  await doSaveEdits();
  location.href = a.href;
});

window.addEventListener("beforeunload", () => { if (saveTimer) doSaveEdits(); });

function setCurrent(list, oldIdx, newIdx, cls) {
  if (oldIdx === newIdx) return false;
  if (oldIdx >= 0) list[oldIdx].el.classList.remove(cls);
  if (newIdx >= 0) list[newIdx].el.classList.add(cls);
  return true;
}

function setSeekFill() {
  const pct = seek.max > 0 ? (seek.value / seek.max) * 100 : 0;
  seek.style.setProperty("--p", pct + "%");
}

function update() {
  const t = audio.currentTime;
  const s = findIndex(sentences, t);
  if (setCurrent(sentences, curS, s, "cur-sentence") && s >= 0) {
    // Scroll inside the box so the sentence sits about a third of the way down
    const el = sentences[s].el;
    const top = el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop;
    box.scrollTo({ top: top - box.clientHeight / 3, behavior: "smooth" });
  }
  curS = s;
  const w = findIndex(words, t);
  setCurrent(words, curW, w, "cur-word");
  curW = w;
  if (!dragging) seek.value = t;
  setSeekFill();
  timeEl.textContent = `${fmt(t)} / ${fmt(audio.duration || 0)}`;
}

function loop() {
  update();
  if (!audio.paused) requestAnimationFrame(loop);
}

function togglePlay() { audio.paused ? audio.play() : audio.pause(); }
function skip(d) { audio.currentTime = Math.min(Math.max(audio.currentTime + d, 0), audio.duration || 0); }

function showIcon(toShow, toHide) { toShow.removeAttribute("hidden"); toHide.setAttribute("hidden", ""); }
audio.addEventListener("play", () => { showIcon(pauseIcon, playIcon); requestAnimationFrame(loop); });
audio.addEventListener("pause", () => { showIcon(playIcon, pauseIcon); update(); });
audio.addEventListener("seeked", update);
audio.addEventListener("timeupdate", () => { if (audio.paused) update(); });
audio.addEventListener("loadedmetadata", () => { seek.max = audio.duration; update(); });
audio.addEventListener("error", () => { statusEl.textContent = t("errAudio"); });

playBtn.addEventListener("click", () => { togglePlay(); playBtn.blur(); });
seek.addEventListener("input", () => { dragging = true; audio.currentTime = +seek.value; setSeekFill(); });
seek.addEventListener("change", () => { dragging = false; seek.blur(); });

const speedsEl = document.getElementById("speeds");
for (const r of SPEEDS) {
  const b = document.createElement("button");
  b.textContent = `${r}x`;
  b.className = r === 1 ? "on" : "";
  b.addEventListener("click", () => {
    audio.playbackRate = r;
    speedsEl.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    b.blur();
  });
  speedsEl.append(b);
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON" || e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "ArrowLeft") { e.preventDefault(); skip(-SKIP); }
  else if (e.code === "ArrowRight") { e.preventDefault(); skip(SKIP); }
});

titleEl.addEventListener("click", async () => {
  const title = prompt(t("renamePromptTitle"), meta.title);
  if (!title || !title.trim()) return;
  await save({ title });
  titleEl.textContent = document.title = meta.title;
});

async function load() {
  const r = await fetch(`/api/transcripts/${ID}`);
  if (!r.ok) { statusEl.textContent = t("errNotFound"); return; }
  const data = await r.json();
  meta = data;
  titleEl.textContent = document.title = meta.title;
  if (!data.transcript) { statusEl.textContent = t("errNotReady"); updateExportLinks(); return; }
  renderListen(currentTurns());
  modeSw.hidden = false;
  updateExportLinks();
  audio.src = `/api/transcripts/${ID}/audio`;
}

applyChrome();
lucide.createIcons();
// lucide.createIcons() replaces each <i data-lucide> placeholder with a new
// <svg> node, so these can only be resolved correctly after it has run.
const playIcon = document.getElementById("playIcon");
const pauseIcon = document.getElementById("pauseIcon");
setInterval(() => fetch("/api/ping").catch(() => {}), 30000);
fetch("/api/ping");
load();
</script>
</body>
</html>
