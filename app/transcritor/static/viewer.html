<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Transcritor</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px 16px 16px;
    font: 15px/1.6 system-ui, sans-serif; color: #222; background: #fafafa;
  }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header a.back { color: #3a6ff7; text-decoration: none; }
  #title { margin: 0; font-size: 18px; flex: 1; min-width: 200px; cursor: pointer; }
  #title:hover::after { content: " ✎"; color: #999; font-size: 14px; }
  .exports a { padding: 4px 10px; border: 1px solid #3a6ff7; color: #3a6ff7; border-radius: 4px; text-decoration: none; font-size: 13px; margin-left: 4px; }
  .exports a:hover { background: #3a6ff7; color: #fff; }
  #bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #play { width: 44px; height: 44px; font-size: 18px; cursor: pointer; }
  #seek { flex: 1; min-width: 200px; height: 28px; accent-color: #3a6ff7; cursor: pointer; }
  #time { font-variant-numeric: tabular-nums; min-width: 130px; text-align: right; }
  #speeds button { padding: 4px 8px; cursor: pointer; border: 1px solid #bbb; background: #fff; border-radius: 4px; }
  #speeds button.on { background: #3a6ff7; color: #fff; border-color: #3a6ff7; }
  #status { color: #a00; }
  .hint { font-size: 12px; color: #888; }
  .box { flex: 1; min-height: 0; overflow-y: auto; border: 1px solid #ccc; border-radius: 4px; background: #fff; padding: 10px 18px; }
  .turn { margin: 0 0 14px; max-width: 900px; }
  .tag { display: inline-block; font-size: 12px; color: #fff; border-radius: 3px; padding: 0 6px; margin-right: 6px; font-variant-numeric: tabular-nums; cursor: pointer; }
  .tag:hover { filter: brightness(1.15); }
  .cur-sentence { background: #fff1a8; }
  .cur-word { text-decoration: underline; text-decoration-thickness: 2px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <a class="back" href="/">← Transcrições</a>
  <h1 id="title" title="Clique para renomear">…</h1>
  <span class="exports">Exportar:
    <a id="exp-docx" href="#">Word</a><a id="exp-txt" href="#">Texto</a><a id="exp-srt" href="#">Legenda (SRT)</a>
  </span>
</header>
<div id="bar">
  <button id="play" title="Tocar/pausar (Espaço)">▶</button>
  <input id="seek" type="range" min="0" max="0" step="0.01" value="0">
  <span id="time">0:00 / 0:00</span>
  <span id="speeds"></span>
  <span id="status"></span>
</div>
<div class="hint">Espaço: tocar/pausar · ←/→: voltar/avançar 3 s · Clique no nome de um falante para renomeá-lo</div>
<div class="box" id="box"></div>
<audio id="audio" preload="auto"></audio>

<script>
const ID = location.pathname.split("/").pop();
const SPEEDS = [0.75, 1, 1.25, 1.5, 2];
const SKIP = 3;
const COLORS = ["#3a6ff7", "#d9534f", "#2e8b57", "#9b59b6", "#e67e22", "#16a085", "#c0392b", "#7f8c8d", "#2c3e50", "#b8860b"];

const audio = document.getElementById("audio");
const seek = document.getElementById("seek");
const playBtn = document.getElementById("play");
const timeEl = document.getElementById("time");
const statusEl = document.getElementById("status");
const box = document.getElementById("box");
const titleEl = document.getElementById("title");

let meta = null;
const sentences = [], words = [], tags = [];
let curS = -1, curW = -1, dragging = false;

const fmt = s => {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
};
const speakerName = sp => meta.speaker_names?.[sp] || `Falante ${sp}`;

// Last index whose start <= t, or -1
function findIndex(items, t) {
  let lo = 0, hi = items.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (items[mid].start <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}

function renderTags() {
  for (const { el, turn } of tags) el.textContent = `${speakerName(turn.speaker)} · ${fmt(turn.start)}`;
}

async function save(changes) {
  const r = await fetch(`/api/transcripts/${ID}`, {
    method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(changes),
  });
  Object.assign(meta, await r.json());
}

function render(transcript) {
  const speakers = meta.speakers || [];
  for (const turn of transcript.turns) {
    const p = document.createElement("p");
    p.className = "turn";
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.style.background = COLORS[speakers.indexOf(turn.speaker) % COLORS.length];
    tag.addEventListener("click", async () => {
      const name = prompt(`Novo nome para "${speakerName(turn.speaker)}":`, meta.speaker_names?.[turn.speaker] || "");
      if (name === null) return;
      await save({ speaker_names: { ...meta.speaker_names, [turn.speaker]: name } });
      renderTags();
    });
    tags.push({ el: tag, turn });
    p.append(tag);
    for (const s of turn.sentences) {
      const sEl = document.createElement("span");
      for (const w of s.words) {
        const wEl = document.createElement("span");
        wEl.textContent = w.text;
        sEl.append(wEl, " ");
        words.push({ start: w.start, el: wEl });
      }
      p.append(sEl);
      sentences.push({ start: s.start, el: sEl });
    }
    box.append(p);
  }
  renderTags();
}

function setCurrent(list, oldIdx, newIdx, cls) {
  if (oldIdx === newIdx) return false;
  if (oldIdx >= 0) list[oldIdx].el.classList.remove(cls);
  if (newIdx >= 0) list[newIdx].el.classList.add(cls);
  return true;
}

function update() {
  const t = audio.currentTime;
  const s = findIndex(sentences, t);
  if (setCurrent(sentences, curS, s, "cur-sentence") && s >= 0) {
    // Scroll inside the box so the sentence sits about a third of the way down
    const el = sentences[s].el;
    const top = el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop;
    box.scrollTo({ top: top - box.clientHeight / 3, behavior: "smooth" });
  }
  curS = s;
  const w = findIndex(words, t);
  setCurrent(words, curW, w, "cur-word");
  curW = w;
  if (!dragging) seek.value = t;
  timeEl.textContent = `${fmt(t)} / ${fmt(audio.duration || 0)}`;
}

function loop() {
  update();
  if (!audio.paused) requestAnimationFrame(loop);
}

function togglePlay() { audio.paused ? audio.play() : audio.pause(); }
function skip(d) { audio.currentTime = Math.min(Math.max(audio.currentTime + d, 0), audio.duration || 0); }

audio.addEventListener("play", () => { playBtn.textContent = "❚❚"; requestAnimationFrame(loop); });
audio.addEventListener("pause", () => { playBtn.textContent = "▶"; update(); });
audio.addEventListener("seeked", update);
audio.addEventListener("timeupdate", () => { if (audio.paused) update(); });
audio.addEventListener("loadedmetadata", () => { seek.max = audio.duration; update(); });
audio.addEventListener("error", () => { statusEl.textContent = "Este navegador não conseguiu tocar o áudio."; });

playBtn.addEventListener("click", () => { togglePlay(); playBtn.blur(); });
seek.addEventListener("input", () => { dragging = true; audio.currentTime = +seek.value; });
seek.addEventListener("change", () => { dragging = false; seek.blur(); });

const speedsEl = document.getElementById("speeds");
for (const r of SPEEDS) {
  const b = document.createElement("button");
  b.textContent = `${r}x`;
  b.className = r === 1 ? "on" : "";
  b.addEventListener("click", () => {
    audio.playbackRate = r;
    speedsEl.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    b.blur();
  });
  speedsEl.append(b);
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON" || e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "ArrowLeft") { e.preventDefault(); skip(-SKIP); }
  else if (e.code === "ArrowRight") { e.preventDefault(); skip(SKIP); }
});

titleEl.addEventListener("click", async () => {
  const title = prompt("Novo título:", meta.title);
  if (!title || !title.trim()) return;
  await save({ title });
  titleEl.textContent = document.title = meta.title;
});

async function load() {
  const r = await fetch(`/api/transcripts/${ID}`);
  if (!r.ok) { statusEl.textContent = "Transcrição não encontrada."; return; }
  const data = await r.json();
  meta = data;
  titleEl.textContent = document.title = meta.title;
  for (const fmtName of ["docx", "txt", "srt"]) {
    document.getElementById(`exp-${fmtName}`).href = `/api/transcripts/${ID}/export.${fmtName}`;
  }
  if (!data.transcript) { statusEl.textContent = "A transcrição ainda não está pronta."; return; }
  render(data.transcript);
  audio.src = `/api/transcripts/${ID}/audio`;
}

setInterval(() => fetch("/api/ping").catch(() => {}), 30000);
fetch("/api/ping");
load();
</script>
</body>
</html>
