<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Transcritor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efebe1;
    --surface: #f7f4ec;
    --ink: #211f19;
    --ink-soft: #655e4e;
    --rule: #d9d2c0;
    --accent: #2b6d60;
    --accent-ink: #fff;
    --amber: #9c6b1f;
    --error: #8f3a2e;
    --radius: 3px;
    --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
    --font-sans: "Archivo", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181a;
      --surface: #1b2023;
      --ink: #e9e6db;
      --ink-soft: #9b9890;
      --rule: #5c666b;
      --accent: #57b39f;
      --accent-ink: #0d1512;
      --amber: #d9a24b;
      --error: #d9776a;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 40px 20px 64px;
    font: 15px/1.6 var(--font-sans);
    color: var(--ink); background: var(--bg);
    transition: background .2s ease, color .2s ease;
  }
  main { max-width: 640px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 32px; }
  a.back { color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 500; }
  a.back:hover { text-decoration: underline; }

  .segmented { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; flex-shrink: 0; }
  .segmented button {
    border: none; border-right: 1px solid var(--rule); background: var(--surface); color: var(--ink-soft);
    font: 500 12px var(--font-sans); padding: 5px 9px; cursor: pointer;
  }
  .segmented button:last-child { border-right: none; }
  .segmented button.on { background: var(--accent); color: var(--accent-ink); }
  .topbar-controls { display: flex; align-items: center; gap: 10px; }
  .globe-icon { width: 16px; height: 16px; color: var(--ink-soft); flex-shrink: 0; }

  h2 { margin: 0 0 20px; font-family: var(--font-serif); font-weight: 600; font-size: 18px; }
  .slip { border-top: 3px solid var(--accent); padding-top: 22px; }

  form { display: grid; gap: 18px 16px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-soft); }
  input[type=password] {
    font: inherit; font-family: var(--font-sans); color: var(--ink);
    background: transparent; border: none; border-bottom: 1px solid var(--rule);
    padding: 7px 2px; border-radius: 0;
  }
  button, a { font-family: var(--font-sans); }
  button[type=submit] {
    font: 600 14px var(--font-sans); padding: 10px 20px; border: none; border-radius: var(--radius);
    background: var(--accent); color: var(--accent-ink); cursor: pointer; justify-self: start;
  }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 13px; color: var(--ink-soft); min-height: 1.4em; }
  .msg.err { color: var(--error); }
  .msg.ok { color: var(--accent); }

  .key-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .key-mask {
    font-family: var(--font-mono); font-size: 15px; letter-spacing: 2px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius);
    padding: 8px 12px; flex: 1;
  }
  .icon-btn {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 36px; height: 36px; border: 1px solid var(--rule); border-radius: var(--radius);
    color: var(--ink-soft); background: none; cursor: pointer;
  }
  .icon-btn:hover { color: var(--error); border-color: var(--error); }
  .icon-btn svg { width: 15px; height: 15px; }
  .key-meta { font-size: 13px; color: var(--ink-soft); }

  dialog {
    background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: var(--radius);
    padding: 22px 24px; max-width: 360px; font: 15px/1.5 var(--font-sans);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog p { margin: 0 0 18px; }
  .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .dialog-actions button { font: 600 13px var(--font-sans); padding: 8px 16px; border-radius: var(--radius); cursor: pointer; }
  .dialog-actions .cancel { background: none; border: 1px solid var(--rule); color: var(--ink); }
  .dialog-actions .danger { background: var(--error); border: none; color: #fff; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <a class="back" href="/" id="backLink"></a>
    <div class="topbar-controls">
      <i data-lucide="globe" class="globe-icon" aria-hidden="true"></i>
      <div class="segmented" id="langsw">
        <button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button>
      </div>
    </div>
  </header>

  <div class="slip">
    <h2 data-i18n="apiKeyTitle"></h2>

    <div id="keyConfigured" hidden>
      <div class="key-row">
        <span class="key-mask">************************</span>
        <button type="button" class="icon-btn" id="deleteKeyBtn">
          <i data-lucide="trash-2" aria-hidden="true"></i>
        </button>
      </div>
      <p class="key-meta" id="keyMeta"></p>
    </div>

    <div id="keyFormSection" hidden>
      <p class="msg">
        <span data-i18n="apiKeyHint"></span> <a href="https://www.assemblyai.com" target="_blank" rel="noopener">assemblyai.com</a>
      </p>
      <form id="apiKeyForm">
        <label>
          <span data-i18n="apiKeyLabel"></span>
          <input type="password" id="apiKeyInput" autocomplete="off" data-i18n-placeholder="apiKeyPlaceholder">
        </label>
        <div>
          <button type="submit" id="apiKeySubmit" data-i18n="apiKeySave"></button>
        </div>
        <div class="msg" id="apiKeyMsg"></div>
      </form>
    </div>
  </div>
</main>

<dialog id="confirmDialog">
  <p data-i18n="confirmDeleteText"></p>
  <div class="dialog-actions">
    <button type="button" class="cancel" id="confirmCancel" data-i18n="cancel"></button>
    <button type="button" class="danger" id="confirmDelete" data-i18n="apiKeyDeleteConfirm"></button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/lucide@1.52.0/dist/umd/lucide.js"></script>
<script>
const I18N = {
  pt: {
    backLink: "← Transcrições",
    apiKeyTitle: "Chave de API da AssemblyAI",
    apiKeyHint: "Crie uma conta gratuita e pegue sua chave em",
    apiKeyLabel: "Chave",
    apiKeyPlaceholder: "Cole sua chave aqui",
    apiKeySave: "Salvar chave",
    apiKeySaving: "Verificando…",
    apiKeySuccess: "Chave salva. Já pode transcrever.",
    apiKeySavedOn: date => `Salva em ${date}.`,
    apiKeyNoDate: "Definida por variável de ambiente.",
    apiKeyDeleteConfirm: "Remover chave",
    confirmDeleteText: "Remover sua chave da AssemblyAI? Você não vai conseguir transcrever até adicionar uma nova.",
    cancel: "Cancelar",
    msgSendError: "Falha ao enviar. O Transcritor ainda está aberto?",
  },
  en: {
    backLink: "← Transcriptions",
    apiKeyTitle: "AssemblyAI API key",
    apiKeyHint: "Create a free account and grab your key at",
    apiKeyLabel: "Key",
    apiKeyPlaceholder: "Paste your key here",
    apiKeySave: "Save key",
    apiKeySaving: "Checking…",
    apiKeySuccess: "Key saved. You're ready to transcribe.",
    apiKeySavedOn: date => `Saved on ${date}.`,
    apiKeyNoDate: "Set via environment variable.",
    apiKeyDeleteConfirm: "Remove key",
    confirmDeleteText: "Remove your AssemblyAI key? You won't be able to transcribe until you add a new one.",
    cancel: "Cancel",
    msgSendError: "Failed to send. Is Transcritor still open?",
  },
  es: {
    backLink: "← Transcripciones",
    apiKeyTitle: "Clave de API de AssemblyAI",
    apiKeyHint: "Crea una cuenta gratuita y obtén tu clave en",
    apiKeyLabel: "Clave",
    apiKeyPlaceholder: "Pega tu clave aquí",
    apiKeySave: "Guardar clave",
    apiKeySaving: "Verificando…",
    apiKeySuccess: "Clave guardada. Ya puedes transcribir.",
    apiKeySavedOn: date => `Guardada el ${date}.`,
    apiKeyNoDate: "Definida por variable de entorno.",
    apiKeyDeleteConfirm: "Eliminar clave",
    confirmDeleteText: "¿Eliminar tu clave de AssemblyAI? No podrás transcribir hasta que agregues una nueva.",
    cancel: "Cancelar",
    msgSendError: "No se pudo enviar. ¿Transcritor sigue abierto?",
  },
};

function detectLang() {
  try {
    const saved = localStorage.getItem("transcritor-ui-lang");
    if (saved && I18N[saved]) return saved;
  } catch {}
  const nav = (navigator.language || "pt").slice(0, 2);
  return I18N[nav] ? nav : "pt";
}

let uiLang = detectLang();
const t = key => I18N[uiLang][key];

function applyI18n() {
  document.documentElement.lang = uiLang === "pt" ? "pt-BR" : uiLang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.getElementById("backLink").textContent = t("backLink");
  document.getElementById("deleteKeyBtn").setAttribute("aria-label", t("apiKeyDeleteConfirm"));
  document.querySelectorAll("#langsw button").forEach(b => b.classList.toggle("on", b.dataset.lang === uiLang));
}

document.getElementById("langsw").addEventListener("click", e => {
  const btn = e.target.closest("button[data-lang]");
  if (!btn) return;
  uiLang = btn.dataset.lang;
  try { localStorage.setItem("transcritor-ui-lang", uiLang); } catch {}
  applyI18n();
  renderKeyMeta();
});

let lastSavedAt = null;

function renderKeyMeta() {
  const el = document.getElementById("keyMeta");
  el.textContent = lastSavedAt
    ? t("apiKeySavedOn")(new Date(lastSavedAt).toLocaleDateString(uiLang === "pt" ? "pt-BR" : uiLang, { dateStyle: "long" }))
    : t("apiKeyNoDate");
}

async function checkSettings() {
  const data = await fetch("/api/settings").then(r => r.json());
  lastSavedAt = data.key_saved_at || null;
  document.getElementById("keyConfigured").hidden = !data.has_api_key;
  document.getElementById("keyFormSection").hidden = data.has_api_key;
  if (data.has_api_key) renderKeyMeta();
}

document.getElementById("apiKeyForm").addEventListener("submit", async e => {
  e.preventDefault();
  const input = document.getElementById("apiKeyInput");
  const btn = document.getElementById("apiKeySubmit");
  const msg = document.getElementById("apiKeyMsg");
  const key = input.value.trim();
  if (!key) return;

  btn.disabled = true;
  msg.className = "msg";
  msg.textContent = t("apiKeySaving");
  try {
    const r = await fetch("/api/settings", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ assemblyai_api_key: key }),
    });
    const data = await r.json();
    if (r.ok) {
      msg.className = "msg ok";
      msg.textContent = t("apiKeySuccess");
      input.value = "";
      await checkSettings();
    } else {
      msg.className = "msg err";
      msg.textContent = data.error || String(r.status);
    }
  } catch {
    msg.className = "msg err";
    msg.textContent = t("msgSendError");
  } finally {
    btn.disabled = false;
  }
});

const confirmDialog = document.getElementById("confirmDialog");
document.getElementById("deleteKeyBtn").addEventListener("click", () => confirmDialog.showModal());
document.getElementById("confirmCancel").addEventListener("click", () => confirmDialog.close());
document.getElementById("confirmDelete").addEventListener("click", async () => {
  await fetch("/api/settings", { method: "DELETE" });
  confirmDialog.close();
  const msg = document.getElementById("apiKeyMsg");
  msg.className = "msg";
  msg.textContent = "";
  await checkSettings();
});

applyI18n();
checkSettings();
lucide.createIcons();
</script>
</body>
</html>
