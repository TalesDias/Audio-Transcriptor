name: AppImage

# main only takes merges, so every push here is a merge landing.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to create the release and its tag.
permissions:
  contents: write

# Queue rather than cancel: every merge is supposed to get its own release, so
# a build that is already running must not be dropped when the next one lands.
concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds in a Debian 11 container, so the runner image only needs Docker.
      - name: Build the AppImage
        run: sh app/packaging/build-appimage.sh

      - name: Check it starts and carries its own ffmpeg
        run: |
          chmod +x dist/Transcritor-x86_64.AppImage
          dist/Transcritor-x86_64.AppImage --appimage-extract >/dev/null
          squashfs-root/usr/bin/ffmpeg -hide_banner -version | head -1
          squashfs-root/usr/bin/ffmpeg -hide_banner -encoders \
            | grep -q libmp3lame
          test -x squashfs-root/usr/bin/transcritor

      # Tag is the version from pyproject.toml plus the run number, so every
      # merge gets its own release without anyone having to bump anything.
      - name: Work out the tag
        id: tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          test -n "$version"
          echo "tag=v$version-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # gh is preinstalled on the runner, so this needs no third-party action.
      # Re-running a build reuses its release instead of failing on the tag.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          file=dist/Transcritor-x86_64.AppImage
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$file" --clobber
          else
            gh release create "$TAG" "$file" \
              --target "$GITHUB_SHA" \
              --title "Transcritor $TAG" \
              --generate-notes
          fi
